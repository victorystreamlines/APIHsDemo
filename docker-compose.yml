version: '3.8'

services:
  # User Management API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/users.db
      - DEBUG=false
      - LOG_LEVEL=INFO
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://localhost:8080","https://localhost:3000","https://localhost:8080"]
    volumes:
      - api_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app_network

  # Development API Service  
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/users_dev.db
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - SECRET_KEY=dev-secret-key-not-for-production
      - BACKEND_CORS_ORIGINS=["*"]
    volumes:
      - .:/app
      - dev_data:/app/data
    restart: unless-stopped
    networks:
      - app_network
    profiles:
      - dev

  # Web server for serving static files (optional)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./ssl:/etc/ssl/certs:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - app_network
    profiles:
      - nginx

  # Load testing service
  locust:
    build:
      context: .
      dockerfile: Dockerfile.locust
    ports:
      - "8089:8089"
    environment:
      - TARGET_HOST=http://api:8000
    depends_on:
      - api
    networks:
      - app_network
    profiles:
      - load-test

volumes:
  api_data:
    driver: local
  dev_data:
    driver: local

networks:
  app_network:
    driver: bridge